<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 348" width="960" height="348" role="img" aria-label="How recortex works: a session writes memories to GitHub issues, and the record gives back a brief, the mind page, the finished text and a board"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#D76744"/></marker></defs><rect width="960" height="348" rx="18" fill="#231D1B"/><text x="40" y="44" font-size="12" font-weight="600" text-anchor="start" fill="#B9ABA1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Liberation Sans,sans-serif">YOUR SESSION</text><rect x="40" y="60" width="230" height="208" rx="12" fill="#302927" stroke="#4B403B" stroke-width="1.5"/><circle cx="68" cy="95" r="6" fill="#D76744"/><text x="86" y="100" font-size="16" font-weight="400" text-anchor="start" fill="#F6EFE3" font-family="Charter,Bitstream Charter,Cambria,Noto Serif,Georgia,serif">finds a result</text><circle cx="68" cy="137" r="6" fill="#D76744"/><text x="86" y="142" font-size="16" font-weight="400" text-anchor="start" fill="#F6EFE3" font-family="Charter,Bitstream Charter,Cambria,Noto Serif,Georgia,serif">makes a decision</text><circle cx="68" cy="179" r="6" fill="#D76744"/><text x="86" y="184" font-size="16" font-weight="400" text-anchor="start" fill="#F6EFE3" font-family="Charter,Bitstream Charter,Cambria,Noto Serif,Georgia,serif">hits a failure</text><circle cx="68" cy="221" r="6" fill="#D76744"/><text x="86" y="226" font-size="16" font-weight="400" text-anchor="start" fill="#F6EFE3" font-family="Charter,Bitstream Charter,Cambria,Noto Serif,Georgia,serif">has an idea</text><line x1="282" y1="164" x2="352" y2="164" stroke="#D76744" stroke-width="2.5" marker-end="url(#a)"/><text x="317" y="150" font-size="12" font-weight="600" text-anchor="middle" fill="#F0997A" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Liberation Sans,sans-serif">memories</text><text x="366" y="44" font-size="12" font-weight="600" text-anchor="start" fill="#B9ABA1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Liberation Sans,sans-serif">GITHUB ISSUES: THE RECORD</text><rect x="366" y="60" width="250" height="208" rx="12" fill="#302927" stroke="#4B403B" stroke-width="1.5"/><rect x="384" y="76" width="214" height="44" rx="9" fill="#4D2F24" stroke="#D76744" stroke-width="1.5"/><text x="398" y="103" font-size="15" font-weight="600" text-anchor="start" fill="#F6EFE3" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Liberation Sans,sans-serif">Hub</text><text x="584" y="103" font-size="12" font-weight="400" text-anchor="end" fill="#B9ABA1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Liberation Sans,sans-serif">pinned</text><rect x="384" y="134" width="214" height="50" rx="9" fill="#231D1B" stroke="#4B403B" stroke-width="1.5"/><text x="398" y="155" font-size="13.5" font-weight="600" text-anchor="start" fill="#F6EFE3" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Liberation Sans,sans-serif">Topic: the text so far</text><circle cx="403" cy="170" r="4.5" fill="#D76744"/><circle cx="418" cy="170" r="4.5" fill="#D76744"/><circle cx="433" cy="170" r="4.5" fill="#D76744"/><circle cx="448" cy="170" r="4.5" fill="#D76744"/><circle cx="463" cy="170" r="4.5" fill="#D76744"/><text x="482" y="174" font-size="11.5" font-weight="400" text-anchor="start" fill="#B9ABA1" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Liberation Sans,sans-serif">dated memories</text><rect x="384" y="196" width="214" height="50" rx="9" fill="#231D1B" stroke="#4B403B" stroke-width="1.5"/><text x="398" y="217" font-size="13.5" font-weight="600" text-anchor="start" fill="#F6EFE3" font-family="system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Liberation Sans,sans-serif">Topic: the text so far</text><circle cx="403" cy="232" r="4.5" fill="#D76744"/><circle cx="418" cy="232" r="4.5" fill="#D76744"