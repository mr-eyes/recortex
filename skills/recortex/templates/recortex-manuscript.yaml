# The plugin's own workflow for the branch that keeps the versions of the paper. recortex writes this file as it is,
# with no value filled in from the project, and compares the branch's copy with its own text: do not edit it by hand.
# It builds the paper with Manubot (manubot/rootstock, pinned below) as HTML, PDF and Word. It publishes nothing: no
# Pages site, no branch, no release, and it writes nothing to the repository.
name: Build the manuscript

on:
  push:
    branches:
      - recortex-manuscript
    tags:
      - 'paper-*'

permissions:
  contents: read
  actions: read

concurrency:
  group: recortex-manuscript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --login {0}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A push to the branch builds at most once a day: stop, successfully, when a run of this workflow on the branch
      # finished less than 24 hours ago. A tag push always builds.
      - name: Once a day on the branch
        id: gate
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "branch" ]; then
            last=$(gh api "repos/$GH_REPO/actions/workflows/recortex-manuscript.yaml/runs?branch=$GITHUB_REF_NAME&status=success&per_page=1" --jq '.workflow_runs[0].updated_at // empty' || true)
            if [ -n "$last" ] && [ "$(date -u -d "$last" +%s)" -gt "$(date -u -d '24 hours ago' +%s)" ]; then
              echo "A build finished less than 24 hours ago; this push is not built."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Check out the branch
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: source
          persist-credentials: false
      - name: Check out Manubot's template
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: manubot/rootstock
          ref: f44f9bbe35441a8acd51a5898e6e739acaf54c1c
          path: rootstock
          fetch-depth: 0
          persist-credentials: false
      # The branch's content/ goes over the template's. The pictures of figures are fetched at the commit the figure
      # block names, from this repository only; any other row, or a failed fetch, leaves the caption saying so.
      - name: Assemble the paper
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -u
          cp -R source/content/. rootstock/content/
          mkdir -p rootstock/content/images
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80"><rect width="320" height="80" fill="#eeeeee"/></svg>\n' > rootstock/content/images/not-available.svg
          unavailable() {
            escaped=${1//./\\.}
            sed -i "s|!\[\([^]]*\)\](images/$escaped\.[A-Za-z]*)|![\1 (image not available to the build)](images/not-available.svg)|" rootstock/content/*.md
          }
          if [ -f source/content/images.tsv ]; then
            while IFS=$'\t' read -r id repo ref path; do
              [ "$id" = "id" ] && continue
              [[ "$id" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,60}$ ]] || continue
              extension=${path##*.}
              if [ "${repo,,}" = "${GH_REPO,,}" ] && [[ "$ref" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] && [[ "$path" =~ ^[A-Za-z0-9._/-]{1,300}$ ]] \
                 && [[ "$path" != *..* ]] && [[ "$extension" =~ ^(png|jpg|jpeg|gif|webp)$ ]] \
                 && gh api -H "Accept: application/vnd.github.raw+json" "repos/$GH_REPO/contents/$path?ref=$ref" > "rootstock/content/images/$id.$extension"; then
                continue
              fi
              unavailable "$id"
            done < source/content/images.tsv
          fi
      - name: Cache Manubot's citations
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: rootstock/ci/cache
          key: ci-cache-${{ github.ref }}
          restore-keys: |
            ci-cache-
      - name: Install the environment
        if: steps.gate.outputs.skip != 'true'
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          activate-environment: manubot
          environment-file: rootstock/build/environment.yml
          auto-activate-base: false
      - name: Build the paper
        if: steps.gate.outputs.skip != 'true'
        working-directory: rootstock
        env:
          BUILD_PDF: 'true'
          BUILD_DOCX: 'true'
          BUILD_LATEX: 'false'
          SPELLCHECK: 'false'
          MANUBOT_USE_DOCKER: 'false'
        run: bash build/build.sh
      - name: Keep the paper
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: paper-${{ github.run_id }}
          path: |
            rootstock/output/manuscript.html
            rootstock/output/manuscript.pdf
            rootstock/output/manuscript.docx
          if-no-files-found: warn
          retention-days: ${{ github.ref_type == 'tag' && 90 || 30 }}
